apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: thesis-ha
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: thesis-ha
spec:
  selector:
    app: aggregator
  ports:
    - name: http-health
      port: 8081
      targetPort: http-health
