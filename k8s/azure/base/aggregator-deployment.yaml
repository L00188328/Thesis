apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: thesis-ha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: thesis-app
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - thesis-app
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: aggregator
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
      containers:
        - name: aggregator
          image: REPLACE_ACR_LOGIN_SERVER/thesis-aggregator:REPLACE_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.aggregator.main"]
          ports:
            - containerPort: 8081
              name: health
          envFrom:
            - configMapRef:
                name: thesis-app-config
            - secretRef:
                name: thesis-app-secrets
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
