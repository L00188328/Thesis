apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: thesis-ha
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: thesis-ha
spec:
  selector:
    app: aggregator
  ports:
    - name: health
      port: 8081
      targetPort: health
