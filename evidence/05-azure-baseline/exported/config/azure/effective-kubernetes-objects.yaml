apiVersion: v1
kind: Namespace
metadata:
  name: thesis-ha
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: thesis-ha
spec:
  ports:
  - name: health
    port: 8081
    targetPort: health
  selector:
    app: aggregator
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: thesis-ha
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: api
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: thesis-ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload
                operator: In
                values:
                - thesis-app
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aggregator
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - python
        - -m
        - services.aggregator.main
        env:
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: thesis-app-config
        - secretRef:
            name: thesis-app-secrets
        image: thesishaacr.azurecr.io/thesis-aggregator@sha256:a41041c885ba594685d1533e6b436ce536015c1effd06a41651ec401a5ca34ff
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: aggregator
        ports:
        - containerPort: 8081
          name: health
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: thesis-app
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: aggregator
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: thesis-ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload
                operator: In
                values:
                - thesis-app
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: api
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - uvicorn
        - services.api.main:app
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        env:
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: thesis-app-config
        - secretRef:
            name: thesis-app-secrets
        image: thesishaacr.azurecr.io/thesis-api@sha256:2bfab63b2894046a842b36fd792a7530a6a28731775a886b081a6fdc3e556b5f
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: thesis-app
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: api
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aggregator
  namespace: thesis-ha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aggregator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: thesis-ha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
